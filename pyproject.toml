[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staticclock"
version = "0.1.0"
description = "Chrono-linguistic release advisory: least-distorting window for information by timezone, language, and dialect (StaticClock, 2026). Advisory only — not a scheduler."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "advisory",
    "timezone",
    "language",
    "dialect",
    "release-window",
    "chronolect",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
staticclock = "staticclock.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/staticclock"
Download = "https://github.com/AzielEliab/staticclock/releases"
Issues = "https://github.com/AzielEliab/staticclock/issues"

[tool.setuptools.packages.find]
include = ["staticclock*"]

[tool.setuptools.package-data]
staticclock = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
